<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #main{
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container{
            width: 50%;
            height: 20px;
            background-color: azure;
            border-width: 2px;
            border-style: solid;
            border-color: orange;
            border-radius: 10px;
            text-align: center;
        }

    </style>
</head>
<body>
    <div id="main">  
        <div class="container">  Div  </div>
    </div>
</body>
</html>
